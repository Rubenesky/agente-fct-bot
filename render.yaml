services:
  - type: web
    name: agente-fct-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python controller.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GIT_PUSH_TOKEN
        sync: false